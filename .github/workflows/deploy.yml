name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PORT: ${{ secrets.VPS_PORT }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install ruff
      - run: ruff check QuantCore/Modulos/ --exclude __pycache__

  build-node:
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd CommandCenter && npm ci && npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: commandcenter-dist
          path: CommandCenter/dist/

  deploy-vps:
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH to VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd C:/ALXQuant
            powershell.exe -Command "git pull origin main"
            powershell.exe -Command "& 'C:/ALXQuant/QuantCore/.venv/Scripts/pip.exe' install -r QuantCore/requirements.txt"
            cd C:/ALXQuant/CommandCenter
            powershell.exe -Command "& 'C:/Program Files/nodejs/node.exe' node_modules/.bin/vite build"
            echo "Deploy completed at $(Get-Date)"
